apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: recipe-frontend-ingress
  namespace: recipe-app
spec:
  ingressClassName: nginx
  rules:
    - host: recipe-tracker-ing.francecentral.cloudapp.azure.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: recipe-frontend
                port:
                  number: 80