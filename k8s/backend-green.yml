apiVersion: apps/v1
kind: Deployment
metadata:
  name: recipe-backend-green
  namespace: recipe-app
spec:
  replicas: 0
  selector:
    matchLabels:
      app: recipe-backend
      version: green
  template:
    metadata:
      labels:
        app: recipe-backend
        version: green
    spec:
      containers:
      - name: backend
        image: recipeacr9c4b0f.azurecr.io/recipe-backend:38c9a68c2bb01661d3b8c3e7c119497e38fbae01
        ports:
        - containerPort: 8080
        env:
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: mongo-secret
              key: MONGO_URI
        - name: MONGO_DB_NAME
          valueFrom:
            secretKeyRef:
              name: mongo-secret
              key: MONGO_DB_NAME
        - name: MONGO_COLLECTION
          valueFrom:
            secretKeyRef:
              name: mongo-secret
              key: MONGO_COLLECTION
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"